<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pide comida y productos a domicilio en Kubo Delivery con seguimiento en tiempo real.">

  <!-- PWA Theme Color -->
  <meta name="theme-color" content="#8B5CF6">
  <meta name="msapplication-TileColor" content="#8B5CF6">

  <!-- iOS PWA Meta Tags & Icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kubo Delivery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Web Fonts Preconnect & Non-blocking Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  </noscript>

  <title>Kubo Delivery</title>
  <link rel="manifest" href="manifest.json">

  <!-- PWA Installation & Web Notifications Interop Script -->
  <script>
    // 1. Service Worker Registration (deferred until browser idle)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        var registerSW = function() {
          navigator.serviceWorker.register('sw.js')
            .then(function(reg) {
              console.log('✅ Kubo Service Worker registrado con éxito:', reg.scope);
            })
            .catch(function(err) {
              console.warn('⚠️ Error al registrar Service Worker:', err);
            });
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(registerSW, { timeout: 3000 });
        } else {
          setTimeout(registerSW, 1500);
        }
      });
    }

    // 2. Before Install Prompt Listener (Chrome / Android / Edge)
    window.deferredInstallPrompt = null;
    window.isAppInstalled = window.matchMedia('(display-mode: standalone)').matches ||
                            window.navigator.standalone === true ||
                            localStorage.getItem('kubo_pwa_installed') === 'true';

    window.addEventListener('beforeinstallprompt', function(e) {
      if (localStorage.getItem('kubo_pwa_installed') === 'true' || localStorage.getItem('kubo_pwa_dismissed') === 'true') {
        return;
      }
      e.preventDefault();
      window.deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('kubo-pwa-installable'));
      console.log('💡 Kubo PWA lista para instalarse.');
    });

    window.addEventListener('appinstalled', function() {
      window.deferredInstallPrompt = null;
      window.isAppInstalled = true;
      try { localStorage.setItem('kubo_pwa_installed', 'true'); } catch(e){}
      console.log('🎉 Kubo PWA instalada exitosamente.');
    });

    // Helper functions callable from Flutter
    window.isPwaStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true ||
             localStorage.getItem('kubo_pwa_installed') === 'true';
    };

    window.canPromptInstall = function() {
      return window.deferredInstallPrompt !== null &&
             localStorage.getItem('kubo_pwa_installed') !== 'true' &&
             localStorage.getItem('kubo_pwa_dismissed') !== 'true';
    };

    window.isIosDevice = function() {
      var userAgent = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent);
    };

    window.triggerPwaInstall = async function() {
      if (window.deferredInstallPrompt) {
        window.deferredInstallPrompt.prompt();
        var choiceResult = await window.deferredInstallPrompt.userChoice;
        window.deferredInstallPrompt = null;
        if (choiceResult && choiceResult.outcome === 'accepted') {
          window.isAppInstalled = true;
          try { localStorage.setItem('kubo_pwa_installed', 'true'); } catch(e){}
          return true;
        }
        return false;
      }
      return false;
    };

    // 3. Web Notification Helpers
    window.getNotificationPermission = function() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission;
    };

    window.requestNotificationPermissionAsync = async function() {
      if (!('Notification' in window)) return 'unsupported';
      try {
        var perm = await Notification.requestPermission();
        return perm;
      } catch (e) {
        return 'denied';
      }
    };

    // Audio Chime synthesizer for notifications using Web Audio API
    window.playNotificationChime = function() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        var ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        var now = ctx.currentTime;
        var osc1 = ctx.createOscillator();
        var gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now); // D5
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.32);

        var osc2 = ctx.createOscillator();
        var gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.12); // A5
        gain2.gain.setValueAtTime(0.35, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.6);
      } catch (e) {
        // Audio playback error fallback
      }
    };

    // Forward active orders to Service Worker so it tracks status changes even if phone is locked
    window.trackOrderInServiceWorker = function(orderId, businessName, status, paymentStatus, driverName, isPickup, pickupCode) {
      if (!orderId) return;
      var payload = {
        type: 'TRACK_ORDER',
        orderId: orderId,
        businessName: businessName || 'Kubo Delivery',
        initialStatus: status || '',
        paymentStatus: paymentStatus || '',
        driverName: driverName || '',
        isPickup: isPickup === true,
        pickupCode: pickupCode || ''
      };

      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage(payload);
      } else if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then(function(reg) {
          if (reg.active) {
            reg.active.postMessage(payload);
          }
        });
      }
    };

    window.showWebNotification = function(title, body, tag, url, icon) {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        return false;
      }

      window.playNotificationChime();

      var resolvedIcon = new URL(icon || 'icons/Icon-192.png', window.location.origin).href;
      var resolvedBadge = new URL('icons/Icon-192.png', window.location.origin).href;

      var notifOptions = {
        body: body || '',
        icon: resolvedIcon,
        badge: resolvedBadge,
        tag: tag || ('kubo-order-' + Date.now()),
        vibrate: [300, 150, 300, 150, 300], // Strong vibration for locked screen
        renotify: true,
        requireInteraction: true, // Crucial for lock screen persistence
        silent: false,
        data: { url: url || '/' }
      };

      // Try via ServiceWorkerRegistration first (supports background / lock screen)
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'SHOW_NOTIFICATION',
          title: title,
          body: body,
          tag: tag,
          data: { url: url || '/' },
          icon: resolvedIcon,
          badge: resolvedBadge
        });
        return true;
      } else if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then(function(reg) {
          reg.showNotification(title, notifOptions);
        });
        return true;
      } else {
        // Fallback to standard Notification API
        try {
          var n = new Notification(title, notifOptions);
          n.onclick = function() {
            window.focus();
            if (url) window.location.href = url;
            n.close();
          };
          return true;
        } catch (e) {
          console.warn('Notification error fallback:', e);
          return false;
        }
      }
    };
  </script>
</head>
<body style="margin: 0; padding: 0; background-color: #FAFAFA;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
